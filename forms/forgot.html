<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · StudyDesk</title>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../css/forgot.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- Background Decorations -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <a href="../index.php">
                    <img src="../images/studydesk_logo.svg" alt="StudyDesk">
                </a>
            </div>

            <!-- Heading -->
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter the email address linked to your account to receive a password reset link.</p>
            </div>

            <!-- Form -->
            <form class="auth-form" id="forgot-form" novalidate>
                <!-- Email -->
                <div class="input-group">
                    <input type="email" id="email" placeholder=" " required>
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                </div>

                <!-- Error Message -->
                <div id="error-msg" style="display:none;"></div>
                <!-- Success Message -->
                <div id="success-msg" style="display:none;"></div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn" id="submitBtn">
                    <span class="btn-text" id="btnText">Send Reset Link</span>
                    <span class="btn-spinner" id="btnSpinner" style="display:none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                Remember your password? <a href="login.html">Login <i class="fas fa-arrow-right"></i></a>
            </div>
        </div>
    </div>

    <script src="../js/forgot.js"></script>
</body>
</html>
