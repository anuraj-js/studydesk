<!-- forms/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyDesk · Login</title>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../css/login.css">

    <!-- Favicon suppressor -->
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- Background Decorations -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <a href="../index.php">
                    <img src="../images/studydesk_logo.svg" alt="StudyDesk">
                </a>
            </div>

            <!-- Heading -->
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your account</p>
            </div>

            <!-- Form -->
            <form class="auth-form" id="login-form" novalidate>
                <!-- Username / Email -->
                <div class="input-group">
                    <input type="text" id="identifier" placeholder=" " required>
                    <label for="identifier">
                        <i class="fas fa-envelope"></i> Username / Email
                    </label>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <input type="password" id="password" placeholder=" " required>
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <!-- Error Message -->
                <div id="error-msg" style="display:none;"></div>

                <!-- Login Button -->
                <button type="submit" class="auth-btn" id="loginBtn">
                    <span class="btn-text" id="btnText">Login</span>
                    <span class="btn-spinner" id="btnSpinner" style="display:none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>

                <!-- Forgot Password -->
                <a href="forgot.html" class="forgot-link">Forgot password?</a>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                New to StudyDesk? <a href="register.html">Create an account <i class="fas fa-arrow-right"></i></a>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
